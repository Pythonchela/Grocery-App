name: marketplace_app
description: "Haatvia marketplace — Flutter client for the shared Laravel API."
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Talks to the same Laravel API as the web storefront.
  http: ^1.2.2
  # Session token, cart contents and theme preference — the mobile equivalent of
  # the web client's localStorage, namespaced by brand the same way.
  shared_preferences: ^2.3.2
  # ₹ formatting and dates in en_IN, matching formatINR/formatDate on the web.
  intl: ^0.19.0
  # Google Sign-In. Yields an ID token that the server verifies against Google
  # before it will issue a session — see GoogleIdentityService.
  google_sign_in: ^6.2.1
  razorpay_flutter: ^1.4.7
  http_parser: ^4.1.2
  file_picker: ^13.1.0
  video_player: ^2.11.1
  share_plus: ^13.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  workmanager: ^0.10.10
  url_launcher: ^6.3.3
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true


  # The three families the design tokens name. The web loads them from Google
  # Fonts via a generated <link>; mobile bundles them, so the app is correct
  # offline and on first paint. Family names here must match DsFont in
  # lib/design/tokens.g.dart — both come from `fontFamily` in the token source.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

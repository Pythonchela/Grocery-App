name: Build live Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare private release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=marketplace\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - name: Add Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
            echo "Push notifications enabled for this build."
          else
            echo "No Firebase config secret set; building without push notifications."
          fi
      - name: Build signed APK against production API
        run: flutter build apk --release --dart-define=API_BASE=https://api.rentalmoney.in/api/v1 --build-number=$((GITHUB_RUN_NUMBER + 1))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BazaarX-live-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties android/app/google-services.json

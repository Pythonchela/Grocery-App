name: Deploy production backend
on:
  push:
    branches: [main]
    paths: ['laravel-backend/**', 'deploy/hostinger/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate && php artisan test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Deploy through restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_BACKEND_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ vars.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/backend_key
          chmod 600 ~/.ssh/backend_key
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive "$GITHUB_SHA:laravel-backend" | gzip > backend.tar.gz
          ssh -i ~/.ssh/backend_key -p 65002 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            u931810717@193.203.185.187 "deploy-backend $GITHUB_SHA" < backend.tar.gz
